    <h1>Ethora chat component: live sandbox</h1>
    <p>One click uploads this Vite + React + TypeScript demo of
      <code>@ethora/chat-component</code> to an online IDE. It installs the package,
      runs the dev server and shows the chat. Log in with a free account from
      <a style="color:#7fb0ff" href="https://app.chat.ethora.com" target="_blank" rel="noreferrer">app.chat.ethora.com</a>.</p>

      <input type="hidden" name="project[files][src/App.tsx]" value="import { useMemo } from 'react';
import { Chat, XmppProvider } from '@ethora/chat-component';
import { useDemoIdentity } from './useDemoIdentity';

/**
 * Ethora chat component: live sandbox.
 *
 * The chat itself is the four lines at the bottom of this file. Everything
 * around it exists so that a visitor is not stopped by a login form:
 * `useDemoIdentity` either mints a fresh user (when a token endpoint is
 * configured in src/demo-config.ts) or reuses a shared demo user, and keeps
 * that identity in localStorage so reloads do not lose the session.
 *
 * Docs: https://github.com/dappros/ethora-chat-component
 */
export default function App() {
  const identity = useDemoIdentity();

  // One memoized object shared by the provider and the chat: a new identity on
  // every render would re-trigger the XMPP init.
  const config = useMemo(
    () =&gt; ({
      // Ethora Cloud production endpoint (the package default).
      baseUrl: 'https://api.chat.ethora.com/v1',

      // With a demo token the component logs in on its own. Without one it
      // falls back to its built-in email/password form.
      ...(identity.token
        ? { jwtLogin: { enabled: true, token: identity.token } }
        : {}),

      // Theme. `primary` also drives icon colours and sender names.
      colors: {
        primary: '#0052CD',
        secondary: '#DBEAFE',
      },

      // Try these:
      // disableHeader: true,
      // disableRooms: true,        // single-room / widget style
      // disableMedia: true,
      // disableNewChatButton: true,
      // disableTypingIndicator: true,
      // typography: { googleFontsFamily: 'Inter', fontSize: 15 },
      // backgroundChat: { color: '#F7F9FC' },
      // hiddenRooms: { titles: ['Main chat'] },
      // inAppNotifications: { enabled: true, position: 'top-right' },
    }),
    [identity.token]
  );

  return (
    &lt;div className=&quot;page&quot;&gt;
      &lt;header className=&quot;topbar&quot;&gt;

      <input type="hidden" name="project[files][src/demo-config.ts]" value="/**
 * How the sandbox gets a session without asking the visitor to log in.
 *
 * Ethora exchanges a &quot;client token&quot; (a JWT signed with your app secret) for a
 * real chat session: POST /v1/users/client. The component does that for you
 * through `config.jwtLogin`. Signing needs the secret, so the token is minted
 * either ahead of time (shared demo user) or by a tiny endpoint of yours
 * (a fresh user per visitor).
 *
 * Fill in ONE of the two. Both can also be passed at runtime:
 *   ?tokenUrl=https://...   or   ?token=JWT...
 * and through Vite env vars VITE_DEMO_TOKEN_URL / VITE_DEMO_CLIENT_TOKEN.
 */

/**
 * 1) Auto-create a user per visitor (recommended).
 *
 * Endpoint that accepts `{ userId }` and answers `{ token, roomJID? }`.
 * A ready-to-deploy implementation lives in `demo-token-server/`.
 * The sandbox remembers the userId it was given, so the same visitor keeps
 * the same identity and history across reloads.
 */
export const DEMO_TOKEN_ENDPOINT = '';

/**
 * 2) Or: one shared &quot;default&quot; demo user, no server at all.
 *
 * Mint it with:  node --env-file=.env tools/make-demo-token.mjs --user ethora-demo --days 30
 * Anyone who opens the sandbox is that user, so use a throwaway account and
 * keep the lifetime short.
 */
export const DEMO_CLIENT_TOKEN = '';

/**
 * 3) Or, with no secrets at all: a normal Ethora account used as the shared
 * &quot;default&quot; demo user. Sign one up at https://app.chat.ethora.com, put its
 * credentials here, and the component logs in with them on load.
 *
 * The password sits in public source, so use a throwaway account, keep it out
 * of anything that matters, and rotate it when the demo is done.
 */
export const DEMO_ACCOUNT = { email: '', password: '' };

/** Optional: drop the demo user straight into one room. */
export const DEMO_ROOM_JID = '';

/** Shown in the top bar so it is obvious which identity is in use. */
export const DEMO_USER_PREFIX = 'sandbox';

      <input type="hidden" name="project[files][src/useDemoIdentity.ts]" value="import { useCallback, useEffect, useState } from 'react';
import {
  DEMO_ACCOUNT,
  DEMO_CLIENT_TOKEN,
  DEMO_ROOM_JID,
  DEMO_TOKEN_ENDPOINT,
  DEMO_USER_PREFIX,
} from './demo-config';

const STORAGE_KEY = 'ethora-sandbox-identity-v1';
/** Re-mint this long before the token actually dies. */
const REFRESH_MARGIN_MS = 5 * 60 * 1000;

export type DemoMode = 'auto' | 'own';

export type DemoIdentity = {
  /** 'demo' means we can log in on our own, 'own' means show the login form. */
  status: 'loading' | 'demo' | 'own' | 'error';
  token?: string;
  /** Set instead of `token` when a shared email/password account is used. */
  account?: { email: string; password: string };
  userId?: string;
  roomJID?: string;
  error?: string;
  /** Endpoint configured, so &quot;new user&quot; is meaningful. */
  canMintUsers: boolean;
  newUser: () =&gt; void;
  useOwnAccount: () =&gt; void;
  backToDemo: () =&gt; void;
};

type Stored = { userId: string; token?: string; exp?: number; mode: DemoMode };

const env = (import.meta as unknown as { env?: Record&lt;string, string&gt; }).env ?? {};
const param = (name: string): string =&gt; {
  try {
    return new URLSearchParams(window.location.search).get(name) ?? '';
  } catch {
    return '';
  }
};

const tokenEndpoint = () =&gt;
  param('tokenUrl') || env.VITE_DEMO_TOKEN_URL || DEMO_TOKEN_ENDPOINT;
const staticToken = () =&gt;
  param('token') || env.VITE_DEMO_CLIENT_TOKEN || DEMO_CLIENT_TOKEN;

/** `exp` out of a JWT payload, in ms. Undefined when the token has none. */
function tokenExpiry(token: string): number | undefined {
  try {
    const payload = token.replace(/^JWT\s+/i, '').split('.')[1];
    const json = JSON.parse(
      atob(payload.replace(/-/g, '+').replace(/_/g, '/'))
    ) as { exp?: number; data?: { userId?: string } };
    return payload &amp;&amp; json.exp ? json.exp * 1000 : undefined;
  } catch {
    return undefined;
  }
}

function tokenUserId(token: string): string | undefined {
  try {
    const payload = token.replace(/^JWT\s+/i, '').split('.')[1];
    const json = JSON.parse(
      atob(payload.replace(/-/g, '+').replace(/_/g, '/'))
    ) as { data?: { userId?: string } };
    return json.data?.userId;
  } catch {
    return undefined;
  }
}

function read(): Stored | null {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? (JSON.parse(raw) as Stored) : null;
  } catch {
    return null;
  }
}

function write(value: Stored | null) {
  try {
    if (value) localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
    else localStorage.removeItem(STORAGE_KEY);
  } catch {
    /* private mode: the session simply does not survive a reload */
  }
}

function newUserId(): string {
  const rnd =
    typeof crypto !== 'undefined' &amp;&amp; 'randomUUID' in crypto
      ? crypto.randomUUID().slice(0, 8)
      : Math.random().toString(36).slice(2, 10);
  return `${DEMO_USER_PREFIX}-${rnd}`;
}

const isFresh = (exp?: number) =&gt; !exp || exp - Date.now() &gt; REFRESH_MARGIN_MS;

/**
 * Resolves the identity the chat should run as, and keeps it in localStorage so
 * a reload does not send the visitor back to a login form.
 */
export function useDemoIdentity(): DemoIdentity {
  const [state, setState] = useState&lt;
    Pick&lt;DemoIdentity, 'status' | 'token' | 'account' | 'userId' | 'roomJID' | 'error'&gt;
  &gt;({ status: 'loading' });
  const [nonce, setNonce] = useState(0);

  useEffect(() =&gt; {
    let cancelled = false;

    const resolve = async () =&gt; {
      const stored = read();

      if (stored?.mode === 'own') {
        setState({ status: 'own' });
        return;
      }

      // A cached token that is still good: no round trip, no login form.
      if (stored?.token &amp;&amp; isFresh(stored.exp)) {
        setState({
          status: 'demo',
          token: stored.token,
          userId: stored.userId,
          roomJID: DEMO_ROOM_JID || undefined,
        });
        return;
      }

      const endpoint = tokenEndpoint();
      if (endpoint) {
        const userId = stored?.userId || newUserId();
        setState({ status: 'loading' });
        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId }),
          });
          if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
          const data = (await res.json()) as { token?: string; roomJID?: string };
          if (!data.token) throw new Error('endpoint returned no token');
          if (cancelled) return;
          write({
            userId,
            token: data.token,
            exp: tokenExpiry(data.token),
            mode: 'auto',
          });
          setState({
            status: 'demo',
            token: data.token,
            userId,
            roomJID: data.roomJID || DEMO_ROOM_JID || undefined,
          });
        } catch (err) {
          if (cancelled) return;
          // A dead endpoint must not lock the visitor out: fall back to the
          // component's own login form instead of a broken screen.
          setState({
            status: 'own',
            error: err instanceof Error ? err.message : String(err),
          });
        }
        return;
      }

      const shared = staticToken();
      if (shared) {
        const exp = tokenExpiry(shared);
        if (!isFresh(exp)) {
          setState({ status: 'error', error: 'demo token expired, mint a new one' });
          return;
        }
        const userId = tokenUserId(shared) || 'demo';
        write({ userId, token: shared, exp, mode: 'auto' });
        setState({
          status: 'demo',
          token: shared,
          userId,
          roomJID: DEMO_ROOM_JID || undefined,
        });
        return;
      }

      if (DEMO_ACCOUNT.email &amp;&amp; DEMO_ACCOUNT.password) {
        write({ userId: DEMO_ACCOUNT.email, mode: 'auto' });
        setState({
          status: 'demo',
          account: DEMO_ACCOUNT,
          userId: DEMO_ACCOUNT.email,
          roomJID: DEMO_ROOM_JID || undefined,
        });
        return;
      }

      setState({ status: 'own' });
    };

    void resolve();

    return () =&gt; {
      cancelled = true;
    };
  }, [nonce]);

  const newUser = useCallback(() =&gt; {
    write(null);
    setNonce((n) =&gt; n + 1);
  }, []);

  const useOwnAccount = useCallback(() =&gt; {
    const stored = read();
    write({ userId: stored?.userId || '', mode: 'own' });
    setNonce((n) =&gt; n + 1);
  }, []);

  const backToDemo = useCallback(() =&gt; {
    write(null);
    setNonce((n) =&gt; n + 1);
  }, []);

  return {
    ...state,
    canMintUsers: Boolean(tokenEndpoint()),
    newUser,
    useOwnAccount,
    backToDemo,
  };
}

      <input type="hidden" name="project[files][README.md]" value="# Ethora chat component: live sandbox

Minimal Vite + React + TypeScript app that mounts [`@ethora/chat-component`](https://www.npmjs.com/package/@ethora/chat-component),
the open-source React chat and AI-agent UI by [Ethora](https://ethora.com).

## Open it online (no local setup)

Open `open-in-online-ide.html` from this folder in a browser and press one of the two buttons:

- Open in CodeSandbox (POSTs the project to the CodeSandbox define API)
- Open in StackBlitz (POSTs the project to StackBlitz)

Neither needs an account. The plain CodeSandbox link is also saved in `codesandbox-url.txt`.
Regenerate both after editing the demo: `node tools/make-launchers.mjs`.

## Run it

```bash
npm install
npm run dev
```

## No login screen in the way

Out of the box the component asks for an Ethora email and password, which is the wrong first
impression for a demo. `src/useDemoIdentity.ts` wraps it and resolves a session on load, then keeps
that identity in `localStorage`, so a reload never sends the visitor back to a login form. Pick one
mode in `src/demo-config.ts`:

| Mode | What the visitor gets | What it costs you |
| --- | --- | --- |
| `DEMO_TOKEN_ENDPOINT` | Own user, created on first visit, reused forever | Deploy `demo-token-server/` (holds the app secret) |
| `DEMO_CLIENT_TOKEN` | One shared demo user | Mint a token: `node --env-file=.env tools/make-demo-token.mjs --user ethora-demo --days 30 --write` |
| `DEMO_ACCOUNT` | One shared demo user | Sign up a throwaway account at [app.chat.ethora.com](https://app.chat.ethora.com), paste email + password |
| none of them | The component's own login form | Nothing |

Both shared modes put a working credential into public source, so use a throwaway identity and
rotate it. The endpoint mode is the only one that keeps the secret server-side and gives every
visitor a separate user, which is what you want if the sandbox is linked from docs or a blog post.

Runtime overrides, handy when you do not want to edit the source in a public sandbox:
`?tokenUrl=https://.../api/demo-token` or `?token=&lt;client JWT&gt;`.

The top bar shows which identity is live and lets the visitor mint a new demo user or switch to
their own Ethora account. Everything else (rooms, history, typing, media) works from there.

The chat connects to Ethora Cloud: `https://api.chat.ethora.com/v1` + `wss://xmpp.chat.ethora.com/ws`.

## The whole integration

```tsx
import { Chat, XmppProvider } from '@ethora/chat-component';

const config = { baseUrl: 'https://api.chat.ethora.com/v1' };

&lt;XmppProvider config={config}&gt;
  &lt;Chat config={config} /&gt;
&lt;/XmppProvider&gt;;
```

`src/App.tsx` has the commented list of the options worth trying first (theme, hide the room list,
typography, backgrounds, notifications). Full reference: the package
[README](https://github.com/dappros/ethora-chat-component#full-config-reference-iconfig).

## How this maps to a real product

The demo modes are the same auth hooks you would use in production:

```tsx
&lt;Chat config={{ jwtLogin: { enabled: true, token: YOUR_CLIENT_JWT } }} /&gt;
// or userLogin (inject an already authenticated user) /
//    customLogin (your own async login) / googleLogin
```

Your backend mints the client JWT from your app secret exactly like
`demo-token-server/api/demo-token.js` does, so the visitor never sees an Ethora login screen.

## Other Ethora SDKs

- React Native: `@ethora/chat-component-rn`
- iOS (SwiftUI): [ethora-sdk-swift](https://github.com/dappros/ethora-sdk-swift)
- Android (Compose): [ethora-sdk-android](https://github.com/dappros/ethora-sdk-android)
- WordPress plugin: [Ethora Chat Assistant](https://wordpress.org/plugins/ethora-chat-assistant/)
